name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Generated statements are up to date
        run: |
          go generate ./statements
          git diff --exit-code -- statements
      - name: Test with coverage
        run: |
          go test -race -coverprofile="$RUNNER_TEMP/cover.out" ./...
          go tool cover -func="$RUNNER_TEMP/cover.out" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
      - name: Coverage per package
        run: |
          go test -cover ./... | awk '
            /coverage:/ { for (i = 1; i <= NF; i++) if ($i == "coverage:") { v = $(i+1); sub(/%$/, "", v); if (v+0 < 90) { print "below 90%: " $0; bad = 1 } } }
            /no test files/ { print "no tests: " $0; bad = 1 }
            END { exit bad }'

  adapter-didgo:
    # The did-go adapter is a separate module (adapters/didgo); the core
    # job above never builds it. This job tests it and runs both profiles
    # against the did-go revision its go.mod pins.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/didgo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: adapters/didgo/go.mod
          cache-dependency-path: adapters/didgo/go.sum
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Test with coverage
        run: |
          go test -race -coverprofile="$RUNNER_TEMP/adapter-cover.out" ./...
          go tool cover -func="$RUNNER_TEMP/adapter-cover.out" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
      - name: Run both profiles against did-go
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          go build -o "$RUNNER_TEMP/did-inspector-didgo" ./cmd/did-inspector-didgo
          for p in did-core-1.0 did-1.1; do
            "$RUNNER_TEMP/did-inspector-didgo" --profile "$p" --deterministic --inspector-revision "$GITHUB_SHA" --out "$RUNNER_TEMP/reports/didgo-$p.json"
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: didgo-reports
          path: ${{ runner.temp }}/reports/
          if-no-files-found: error
      - name: No requirement-level statement is FAIL or ERROR
        # The gate counts requirement-level statements only. Recommendation
        # failures (SHOULD, RECOMMENDED) are printed but do not fail it.
        run: |
          bad=0
          for f in "$RUNNER_TEMP"/reports/didgo-*.json; do
            n=$(jq '.totals_by_level.requirement.FAIL + .totals_by_level.requirement.ERROR' "$f")
            r=$(jq '.totals_by_level.recommendation.FAIL + .totals_by_level.recommendation.ERROR' "$f")
            echo "$f: $n requirement-level and $r recommendation-level statement(s) FAIL or ERROR"
            jq -r '.statements[] | select((.verdict == "FAIL" or .verdict == "ERROR") and .level != "recommendation") | "  \(.verdict) \(.id)"' "$f"
            jq -r '.statements[] | select((.verdict == "FAIL" or .verdict == "ERROR") and .level == "recommendation") | "  recommendation \(.verdict) \(.id)"' "$f"
            if [ "$n" -ne 0 ]; then bad=1; fi
          done
          exit "$bad"

  adapter-sage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/sage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: adapters/sage/go.sum
      - name: Verify pinned modules and format
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          go mod download
          go mod verify
          test -z "$(gofmt -l .)"
          go vet -mod=readonly ./...
          go list -m -json github.com/sage-x-project/did-go github.com/sage-x-project/did-go/advanced/sage > "$RUNNER_TEMP/sage-subject-modules.json"
          go list -m -json github.com/nlnwa/whatwg-url golang.org/x/net golang.org/x/text github.com/bits-and-blooms/bitset > "$RUNNER_TEMP/sage-url-observer-modules.json"
      - name: Lint adapter
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Test independent adapter and native CLI with coverage
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          go test -mod=readonly -race -coverprofile="$RUNNER_TEMP/sage-adapter-cover.out" ./...
          go tool cover -func="$RUNNER_TEMP/sage-adapter-cover.out" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
          go test -cover ./... | awk '/coverage:/ { for (i=1;i<=NF;i++) if ($i=="coverage:") { v=$(i+1); sub(/%$/,"",v); if(v+0<90) bad=1 } } END { exit bad }'
      - name: Observe both pinned profiles and preserve all raw cases
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          mkdir -p "$RUNNER_TEMP/sage-reports"
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/did-inspector-sage" ./cmd/did-inspector-sage
          sha256sum "$RUNNER_TEMP/did-inspector-sage" > "$RUNNER_TEMP/sage-observer-binary.sha256"
          go version > "$RUNNER_TEMP/sage-observer-compiler.txt"
          for p in did-core-1.0 did-1.1; do
            "$RUNNER_TEMP/did-inspector-sage" --profile "$p" --deterministic --inspector-revision "$GITHUB_SHA" --out "$RUNNER_TEMP/sage-reports/$p.json" --raw-out "$RUNNER_TEMP/sage-reports/$p-raw.json"
          done
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sage-reports'
          for name,passed,pending in [('did-core-1.0',16,190),('did-1.1',20,465)]:
              report=json.loads((root/(name+'.json')).read_text())
              assert report['subject']['revision']=='2ef282b40ccfe243c6cf3b1c05594e02171126cc'
              assert report['totals_by_level']['requirement']['FAIL']==0
              assert report['totals_by_level']['requirement']['ERROR']==0
              assert report['totals']['PASS']==passed and report['totals']['NOT_RUN']==pending
              failed={s['id'] for s in report['statements'] if s['verdict']=='FAIL'}
              assert failed==({'cid10#JsonWebKey.7'} if name=='did-1.1' else set())
              raw=json.loads((root/(name+'-raw.json')).read_text())
              assert len(raw['cases'])==6 and raw['subject']==report['subject']
          PYTHON
      - name: Observe SAGE native resolution and loopback TLS separately
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          for p in did-core-1.0 did-1.1; do
            "$RUNNER_TEMP/did-inspector-sage" --scope resolution --profile "$p" --deterministic --inspector-revision "$GITHUB_SHA" --out "$RUNNER_TEMP/sage-reports/resolution-$p.json" --raw-out "$RUNNER_TEMP/sage-reports/resolution-$p-raw.json"
          done
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sage-reports'
          for name,passed,pending,cases in [('did-core-1.0',33,173,16),('did-1.1',82,402,86)]:
              report=json.loads((root/('resolution-'+name+'.json')).read_text())
              assert report['subject']['name']=='did-go/advanced/sage-resolution'
              assert report['subject']['revision']=='2ef282b40ccfe243c6cf3b1c05594e02171126cc'
              assert report['totals']['FAIL']==0 and report['totals']['ERROR']==0
              assert report['totals']['PASS']==passed and report['totals']['NOT_RUN']==pending
              assert report['totals_by_level']['requirement']['PASS']==(33 if name=='did-core-1.0' else 80)
              raw=json.loads((root/('resolution-'+name+'-raw.json')).read_text())
              assert len(raw['cases'])==cases and raw['subject']==report['subject']
              assert report['totals']['NOT_APPLICABLE']==(2 if name=='did-1.1' else 0)
              urlcases=[c for c in raw['cases'] if '/native-url-record-' in c['case']]
              assert len(urlcases)==(5 if name=='did-1.1' else 0)
              for case in urlcases:
                  assert len(case['observations'])==7
                  for obs in case['observations']:
                      assert obs['verdict']==('NOT_APPLICABLE' if obs['statement']=='cid10#controllers.3' else 'PASS')
                      assert obs['input'] and obs['observed'] and 'whatwg-url v0.6.2' in obs['detail']
              nativecases=[c for c in raw['cases'] if '/native-result-' in c['case']]
              assert len(nativecases)==(10 if name=='did-1.1' else 0)
              for case in nativecases:
                  active='/native-result-active-record-' in case['case']
                  assert len(case['observations']) >= 2
                  for obs in case['observations']:
                      conditional=obs['statement'] in ['res10-crd20261001#resolving.5','res10-crd20261001#did-document-metadata.7']
                      assert obs['verdict']==('NOT_APPLICABLE' if active and conditional else 'PASS')
                      assert obs['input'] and obs['observed'] and obs['detail']
          PYTHON
      - name: Check complete SAGE pending clause inventory
        run: |
          python3 - <<'PYTHON'
          import collections, hashlib, json, os
          from pathlib import Path
          repo=Path('../..')
          inventory=json.loads((repo/'docs/sage-resolution-gaps.json').read_text())
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'sage-reports/resolution-did-1.1.json').read_text())
          raw=json.loads((Path(os.environ['RUNNER_TEMP'])/'sage-reports/resolution-did-1.1-raw.json').read_text())
          assert inventory['schema']=='sage-resolution-gap-inventory/2'
          assert inventory['scope']=='resolution' and inventory['profile']==report['profile']=='did-1.1'
          assert inventory['baseline']['subject']==report['subject']==raw['subject']
          assert inventory['baseline']['publications']==report['specs']
          assert report['inspector']['revision']==os.environ['GITHUB_SHA']
          assert inventory['expected_live_totals']==report['totals']
          assert inventory['expected_live_totals_by_level']==report['totals_by_level']
          assert inventory['expected_live_cases']==len(raw['cases'])==86
          pending=inventory['pending']
          observed=inventory['observed_since_baseline']
          ids=[row['id'] for row in pending]
          assert len(ids)==len(set(ids))==402
          assert set(ids)=={row['id'] for row in report['statements'] if row['verdict']=='NOT_RUN'}
          allrows=pending+observed
          allids=[row['id'] for row in allrows]
          assert len(allids)==len(set(allids))==inventory['baseline']['totals']['NOT_RUN']==416
          assert hashlib.sha256(json.dumps(sorted(allids),separators=(',',':')).encode()).hexdigest()==inventory['baseline']['pending_ids_sha256']
          assert len(observed)==14
          assert collections.Counter(row['expected_live_verdict'] for row in observed)=={'PASS':13,'NOT_APPLICABLE':1}
          live={row['id']:row['verdict'] for row in report['statements']}
          cases={case['case']:case for case in raw['cases']}
          assert len(cases)==len(raw['cases'])
          for row in observed:
              assert live[row['id']]==row['expected_live_verdict']
              expectedcases={case['case'] for case in raw['cases'] if '/native-result-' in case['case'] and any(o['statement']==row['id'] for o in case['observations'])}
              assert row['cases'] and len(row['cases'])==len(set(row['cases']))
              assert set(row['cases'])==expectedcases
              matches=[]
              for caseid in row['cases']:
                  found=[o for o in cases[caseid]['observations'] if o['statement']==row['id']]
                  assert len(found)==1
                  observation=found[0]
                  assert observation['verdict'] in ['PASS','NOT_APPLICABLE']
                  assert observation['input'] and observation['observed'] and observation['detail']
                  matches.append(observation['verdict'])
              assert row['expected_live_verdict'] in matches
          statements={}
          for publication in ['did11-cr20260305','cid10','res10-crd20261001']:
              for row in json.loads((repo/'statements'/(publication+'.json')).read_text())['statements']:
                  statements[row['id']]=row
          scope=json.loads((repo/'statements/scope.json').read_text())
          categories=collections.Counter()
          for row in allrows:
              original=statements[row['id']]
              assert row['baseline_verdict']=='NOT_RUN'
              assert row['level']==original['level'] and row['keywords']==original.get('keywords',[])
              assert row['text_sha256']==hashlib.sha256(original['text'].encode()).hexdigest()
              assert row['generic_scope']==scope[row['id']]['scope']
              route=inventory['routes'][row['route']]
              assert route['operation'] and route['prerequisite'] and route['evidence']
              for reference in route['evidence']:
                  assert (repo/reference).is_file()
              if row['id'] in set(ids):
                  categories[route['category']]+=1
          assert dict(categories)==inventory['categories']
          assert collections.Counter(row['level'] for row in allrows)=={'requirement':368,'recommendation':48}
          assert collections.Counter(row['level'] for row in pending)=={'requirement':354,'recommendation':48}
          print('Verified 402 pending and 14 newly observed clauses; all 416 historical ids retained')
          PYTHON
      - name: Preserve independent profile and raw observation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sage-projection-reports
          path: |
            ${{ runner.temp }}/sage-reports/
            ${{ runner.temp }}/sage-adapter-cover.out
            ${{ runner.temp }}/sage-subject-modules.json
            ${{ runner.temp }}/sage-url-observer-modules.json
            ${{ runner.temp }}/sage-observer-binary.sha256
            ${{ runner.temp }}/sage-observer-compiler.txt
          if-no-files-found: error
