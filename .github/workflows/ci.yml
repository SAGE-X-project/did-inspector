name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Generated statements are up to date
        run: |
          go generate ./statements
          git diff --exit-code -- statements
      - name: Test with coverage
        run: |
          go test -race -coverprofile="$RUNNER_TEMP/cover.out" ./...
          go tool cover -func="$RUNNER_TEMP/cover.out" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
      - name: Coverage per package
        run: |
          go test -cover ./... | awk '
            /coverage:/ { for (i = 1; i <= NF; i++) if ($i == "coverage:") { v = $(i+1); sub(/%$/, "", v); if (v+0 < 90) { print "below 90%: " $0; bad = 1 } } }
            /no test files/ { print "no tests: " $0; bad = 1 }
            END { exit bad }'
