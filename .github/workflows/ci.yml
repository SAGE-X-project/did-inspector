name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Generated statements are up to date
        run: |
          go generate ./statements
          git diff --exit-code -- statements
      - name: Test with coverage
        run: |
          go test -timeout=20m -race -coverprofile="$RUNNER_TEMP/cover.out" ./...
          go tool cover -func="$RUNNER_TEMP/cover.out" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
      - name: Service inspection function coverage
        run: |
          go tool cover -func="$RUNNER_TEMP/cover.out" | awk '
            /\/(service\.go|service_source\.go):/ { v=$NF; sub(/%$/, "", v); found++; if (v+0 < 90) { print "below 90%: " $0; bad=1 } }
            END { if (found != 15 || bad) exit 1 }'
      - name: Selection inspection function coverage
        run: |
          go tool cover -func="$RUNNER_TEMP/cover.out" | awk '
            /\/selection\.go:/ { v=$NF; sub(/%$/, "", v); found++; if (v+0 < 90) { print "below 90%: " $0; bad=1 } }
            END { if (found != 15 || bad) exit 1 }'
      - name: Dispatch inspection function coverage
        run: |
          go tool cover -func="$RUNNER_TEMP/cover.out" | awk '
            /\/dispatch\.go:/ { v=$NF; sub(/%$/, "", v); found++; if (v+0 < 90) { print "below 90%: " $0; bad=1 } }
            END { if (found != 9 || bad) exit 1 }'
      - name: Coverage per package
        run: |
          go test -timeout=20m -cover ./... | awk '
            /coverage:/ { for (i = 1; i <= NF; i++) if ($i == "coverage:") { v = $(i+1); sub(/%$/, "", v); if (v+0 < 90) { print "below 90%: " $0; bad = 1 } } }
            /no test files/ { print "no tests: " $0; bad = 1 }
            END { exit bad }'

  adapter-didgo:
    # The did-go adapter is a separate module (adapters/didgo); the core
    # job above never builds it. This job tests it and runs both profiles
    # against the did-go revision its go.mod pins.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/didgo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: adapters/didgo/go.mod
          cache-dependency-path: adapters/didgo/go.sum
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Test with coverage
        run: |
          go test -race -coverprofile="$RUNNER_TEMP/adapter-cover.out" ./...
          go tool cover -func="$RUNNER_TEMP/adapter-cover.out" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
      - name: Run both profiles against did-go
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          go build -o "$RUNNER_TEMP/did-inspector-didgo" ./cmd/did-inspector-didgo
          for p in did-core-1.0 did-1.1; do
            "$RUNNER_TEMP/did-inspector-didgo" --profile "$p" --deterministic --inspector-revision "$GITHUB_SHA" --out "$RUNNER_TEMP/reports/didgo-$p.json"
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: didgo-reports
          path: ${{ runner.temp }}/reports/
          if-no-files-found: error
      - name: No requirement-level statement is FAIL or ERROR
        # The gate counts requirement-level statements only. Recommendation
        # failures (SHOULD, RECOMMENDED) are printed but do not fail it.
        run: |
          bad=0
          for f in "$RUNNER_TEMP"/reports/didgo-*.json; do
            n=$(jq '.totals_by_level.requirement.FAIL + .totals_by_level.requirement.ERROR' "$f")
            r=$(jq '.totals_by_level.recommendation.FAIL + .totals_by_level.recommendation.ERROR' "$f")
            echo "$f: $n requirement-level and $r recommendation-level statement(s) FAIL or ERROR"
            jq -r '.statements[] | select((.verdict == "FAIL" or .verdict == "ERROR") and .level != "recommendation") | "  \(.verdict) \(.id)"' "$f"
            jq -r '.statements[] | select((.verdict == "FAIL" or .verdict == "ERROR") and .level == "recommendation") | "  recommendation \(.verdict) \(.id)"' "$f"
            if [ "$n" -ne 0 ]; then bad=1; fi
          done
          exit "$bad"

  adapter-sage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/sage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: adapters/sage/go.sum
      - name: Verify pinned modules and format
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          go mod download
          go mod verify
          test -z "$(gofmt -l .)"
          go vet -mod=readonly ./...
          go list -m -json github.com/sage-x-project/did-go github.com/sage-x-project/did-go/advanced/sage > "$RUNNER_TEMP/sage-subject-modules.json"
          go list -m -json github.com/nlnwa/whatwg-url golang.org/x/net golang.org/x/text github.com/bits-and-blooms/bitset > "$RUNNER_TEMP/sage-url-observer-modules.json"
      - name: Lint adapter
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - name: Test independent adapter and native CLI with coverage
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          go test -mod=readonly -race -coverprofile="$RUNNER_TEMP/sage-adapter-cover.out" ./...
          go tool cover -func="$RUNNER_TEMP/sage-adapter-cover.out" | awk '/^total:/ { sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'
          go test -cover ./... | awk '/coverage:/ { for (i=1;i<=NF;i++) if ($i=="coverage:") { v=$(i+1); sub(/%$/,"",v); if(v+0<90) bad=1 } } END { exit bad }'
      - name: Observe both pinned profiles and preserve all raw cases
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          export GOROOT="$(go env GOROOT)"
          mkdir -p "$RUNNER_TEMP/sage-reports"
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/did-inspector-sage" ./cmd/did-inspector-sage
          sha256sum "$RUNNER_TEMP/did-inspector-sage" > "$RUNNER_TEMP/sage-observer-binary.sha256"
          go version > "$RUNNER_TEMP/sage-observer-compiler.txt"
          for p in did-core-1.0 did-1.1; do
            "$RUNNER_TEMP/did-inspector-sage" --case-timeout 30s --profile "$p" --deterministic --inspector-revision "$GITHUB_SHA" --out "$RUNNER_TEMP/sage-reports/$p.json" --raw-out "$RUNNER_TEMP/sage-reports/$p-raw.json"
          done
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sage-reports'
          for name,passed,pending in [('did-core-1.0',16,190),('did-1.1',20,465)]:
              report=json.loads((root/(name+'.json')).read_text())
              assert report['subject']['revision']=='2ef282b40ccfe243c6cf3b1c05594e02171126cc'
              assert report['totals_by_level']['requirement']['FAIL']==0
              assert report['totals_by_level']['requirement']['ERROR']==0
              assert report['totals']['PASS']==passed and report['totals']['NOT_RUN']==pending
              failed={s['id'] for s in report['statements'] if s['verdict']=='FAIL'}
              assert failed==({'cid10#JsonWebKey.7'} if name=='did-1.1' else set())
              raw=json.loads((root/(name+'-raw.json')).read_text())
              assert len(raw['cases'])==6 and raw['subject']==report['subject']
          PYTHON
      - name: Observe SAGE native resolution and loopback TLS separately
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          export GOROOT="$(go env GOROOT)"
          for p in did-core-1.0 did-1.1; do
            "$RUNNER_TEMP/did-inspector-sage" --case-timeout 30s --scope resolution --profile "$p" --deterministic --inspector-revision "$GITHUB_SHA" --out "$RUNNER_TEMP/sage-reports/resolution-$p.json" --raw-out "$RUNNER_TEMP/sage-reports/resolution-$p-raw.json"
          done
          python3 - <<'PYTHON'
          import base64, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sage-reports'
          for name,passed,pending,cases in [('did-core-1.0',33,173,16),('did-1.1',362,110,361)]:
              report=json.loads((root/('resolution-'+name+'.json')).read_text())
              assert report['subject']['name']=='did-go/advanced/sage-resolution'
              assert report['subject']['revision']=='2ef282b40ccfe243c6cf3b1c05594e02171126cc'
              assert report['totals']['FAIL']==(10 if name=='did-1.1' else 0) and report['totals']['ERROR']==0
              assert report['totals']['PASS']==passed and report['totals']['NOT_RUN']==pending
              assert report['totals_by_level']['requirement']['PASS']==(33 if name=='did-core-1.0' else 348)
              required_failures={row['id'] for row in report['statements'] if row['level']=='requirement' and row['verdict'] in ['FAIL','ERROR']}
              assert required_failures==({'cid10#verification-methods.9','cid10#verification-methods.11','cid10#conformance.2','did11-cr20260305#production-and-consumption.18','res10-crd20261001#dereferencing-algorithm-resource.5','cid10#fragment-resolution.4'} if name=='did-1.1' else set())
              raw=json.loads((root/('resolution-'+name+'-raw.json')).read_text())
              assert len(raw['cases'])==cases and raw['subject']==report['subject']
              assert report['totals']['NOT_APPLICABLE']==(4 if name=='did-1.1' else 0)
              urlcases=[c for c in raw['cases'] if '/native-url-record-' in c['case']]
              assert len(urlcases)==(5 if name=='did-1.1' else 0)
              for case in urlcases:
                  assert len(case['observations'])==7
                  for obs in case['observations']:
                      assert obs['verdict']==('NOT_APPLICABLE' if obs['statement']=='cid10#controllers.3' else 'PASS')
                      assert obs['input'] and obs['observed'] and 'whatwg-url v0.6.2' in obs['detail']
              nativecases=[c for c in raw['cases'] if '/native-result-' in c['case']]
              assert len(nativecases)==(10 if name=='did-1.1' else 0)
              for case in nativecases:
                  active='/native-result-active-record-' in case['case']
                  assert len(case['observations']) >= 2
                  for obs in case['observations']:
                      conditional=obs['statement'] in ['res10-crd20261001#resolving.5','res10-crd20261001#did-document-metadata.7']
                      assert obs['verdict']==('NOT_APPLICABLE' if active and conditional else 'PASS')
                      assert obs['input'] and obs['observed'] and obs['detail']
              metadatacases=[c for c in raw['cases'] if '/native-metadata-' in c['case']]
              assert len(metadatacases)==(24 if name=='did-1.1' else 0)
              for case in metadatacases:
                  assert len(case['observations'])==4
                  for obs in case['observations']:
                      assert obs['verdict']=='PASS' and obs['input'] and obs['observed']
                      capture=json.loads(obs['observed'])
                      request=json.loads(obs['input'])
                      role=request['role']
                      assert role in ['resolution','document']
                      selected=capture[role]
                      expected=('resolution.ResolutionMetadata' if role=='resolution' else 'document.Metadata')
                      assert selected['serializer']=='github.com/sage-x-project/did-go/'+expected+'.MarshalJSON'
                      assert selected['bytes'] and not selected.get('error')
                      decoded=base64.b64decode(selected['bytes'],validate=True).decode('utf-8')
                      assert isinstance(json.loads(decoded),dict)
              branches=[c for c in raw['cases'] if '/native-branch-' in c['case']]
              wire=[c for c in raw['cases'] if '/wire-branch-' in c['case']]
              assert len(branches)==(3 if name=='did-1.1' else 0)
              assert len(wire)==(10 if name=='did-1.1' else 0)
              for case in branches+wire:
                  for obs in case['observations']:
                      assert obs['verdict']=='PASS' and obs['input'] and obs['observed']
                      capture=json.loads(obs['observed'])
                      request=json.loads(obs['input'])['request']
                      if '/wire-branch-' in case['case']:
                          assert capture['exchange']['tls'] and capture['exchange']['method']==request['http']['Method']
                          assert capture['native']['request']['input']==request['input']
                          assert capture['native']['request']['function']==request['native_function']
              keycases=[c for c in raw['cases'] if '/native-key-fields-' in c['case']]
              assert len(keycases)==(5 if name=='did-1.1' else 0)
              for case in keycases:
                  assert len(case['observations'])==3
                  for obs in case['observations']:
                      assert obs['verdict']==('FAIL' if obs['statement']=='cid10#JsonWebKey.7' else 'PASS')
                      assert obs['input'] and obs['observed']
              if name=='did-1.1':
                  failures=[row for row in report['statements'] if row['verdict']=='FAIL' and row['level']=='recommendation']
                  assert len(failures)==4 and {(row['id'],row['level']) for row in failures}=={('cid10#JsonWebKey.7','recommendation'),('did11-cr20260305#json-ld-processors.6','recommendation'),('cid10#JsonWebKey.5','recommendation'),('res10-crd20261001#resolver-architectures-proxied.2','recommendation')}
              representations=[c for c in raw['cases'] if '/native-representation-' in c['case'] and '/native-representation-input-' not in c['case']]
              assert len(representations)==(5 if name=='did-1.1' else 0)
              for case in representations:
                  assert len(case['observations'])==4
                  for obs in case['observations']:
                      assert obs['verdict']=='PASS' and obs['input'] and obs['observed']
                      capture=json.loads(obs['observed'])
                      document=json.loads(base64.b64decode(capture['raw'],validate=True).decode('utf-8'))
                      assert document['@context']=='https://www.w3.org/ns/did/v1.1'
                      assert capture['metadata']['contentType']=='application/did'
              pipelines=[c for c in raw['cases'] if '/native-pipeline-' in c['case']]
              assert len(pipelines)==(5 if name=='did-1.1' else 0)
              for case in pipelines:
                  assert len(case['observations'])==5
                  for obs in case['observations']:
                      assert obs['verdict']=='PASS' and obs['input'] and obs['observed']
                      capture=json.loads(obs['observed'])
                      assert len(capture['producer'])==len(capture['consumer'])==1
                      p,c=capture['producer'][0],capture['consumer'][0]
                      assert p['operation']=='github.com/sage-x-project/did-go/producer.Producer.Produce'
                      assert c['operation']=='github.com/sage-x-project/did-go/consumer.Consumer.Consume'
                      assert p['version']==c['version']=='1.1' and p['json_ld'] and c['json_ld']
                      assert not p['include_secret'] and not c['strict'] and c['require']==c['expected']=='unknown'
                      assert not p.get('error') and not c.get('error') and not p.get('capture_error') and not c.get('capture_error')
                      assert p['output']==c['input']==capture['result']['raw']
                      assert p['media_type']==c['media_type']=='application/did' and not c['dropped_terms']
                      decode=lambda value: json.loads(base64.b64decode(value,validate=True).decode('utf-8'))
                      model,entries,wire=decode(p['model']),decode(p['entries']),decode(p['output'])
                      data,representation=decode(c['model']),decode(c['entries'])
                      assert entries=={} and '@context' not in model and '@context' not in data
                      assert representation=={'@context':'https://www.w3.org/ns/did/v1.1'}
                      assert model==data=={k:v for k,v in wire.items() if k!='@context'}
              rootcases=[c for c in raw['cases'] if '/native-production-root-' in c['case']]
              assert len(rootcases)==(5 if name=='did-1.1' else 0)
              for case in rootcases:
                  obs=case['observations'][0]
                  assert len(case['observations'])==1 and obs['verdict']=='PASS'
                  capture=json.loads(obs['observed'])
                  assert len(capture['producer'])==1
                  p=capture['producer'][0]
                  assert p['operation']=='github.com/sage-x-project/did-go/producer.Producer.Produce'
                  assert p['version']=='1.1' and p['json_ld'] and not p['include_secret']
                  decode=lambda value: json.loads(base64.b64decode(value,validate=True).decode('utf-8'))
                  wire=decode(p['output'])
                  assert isinstance(wire,dict)
                  for field in ['model','entries']:
                      assert set(decode(p[field]))<=set(wire)
              consumers=[c for c in raw['cases'] if '/native-consumer-' in c['case'] and '/native-consumer-conformance-' not in c['case']]
              assert len(consumers)==(7 if name=='did-1.1' else 0)
              media_inputs=[]
              nonobjects=[]
              for case in consumers:
                  obs=case['observations'][0]
                  assert len(case['observations'])==1 and obs['verdict']=='PASS' and obs['input'] and obs['observed']
                  q,c=json.loads(obs['input']),json.loads(obs['observed'])
                  assert c['operation']=='github.com/sage-x-project/did-go/consumer.Consumer.Consume'
                  assert c['input']==q['data'] and c['media_type']==q['media_type']
                  assert c['require']==c['expected']=='unknown' and not c['strict']
                  decode=lambda value: json.loads(base64.b64decode(value,validate=True).decode('utf-8'))
                  if '/native-consumer-media-' in case['case']:
                      media_inputs.append(q['data'])
                      assert not c.get('error') and not c.get('capture_error') and not c['json_ld'] and not c['dropped_terms']
                      assert c['version']==('1.1' if q['media_type']=='application/did' else '1.0')
                      assert decode(c['model'])==decode(q['data']) and decode(c['entries'])=={}
                  else:
                      assert q['media_type']=='application/did' and c.get('error') and not c['model'] and not c['entries']
                      value=decode(q['data'])
                      assert not isinstance(value,dict)
                      nonobjects.append(type(value).__name__)
              if name=='did-1.1':
                  assert len(media_inputs)==2 and media_inputs[0]==media_inputs[1]
                  assert sorted(nonobjects)==['NoneType','bool','int','list','str']
              paired=[c for c in raw['cases'] if '/native-consumer-conformance-' in c['case']]
              assert len(paired)==(9 if name=='did-1.1' else 0)
              for case in paired:
                  assert len(case['observations'])==2
                  for obs in case['observations']:
                      assert obs['verdict']=='PASS' and obs['input'] and obs['observed']
                      f,pair=json.loads(obs['input']),json.loads(obs['observed'])
                      assert f['violated_statement']!='cid10#subjects.3'
                      decode=lambda value: json.loads(base64.b64decode(value,validate=True).decode('utf-8'))
                      for role in ['positive','negative']:
                          q,c=f[role],pair[role]
                          assert c['operation']=='github.com/sage-x-project/did-go/consumer.Consumer.Consume'
                          assert c['input']==q['data'] and c['media_type']==q['media_type']=='application/did'
                          assert c['require']==c['expected']=='unknown' and not c['strict']
                      p,n=pair['positive'],pair['negative']
                      assert not p.get('error') and not p.get('capture_error') and p['version']=='1.1' and not p['json_ld'] and not p['dropped_terms']
                      assert decode(p['model'])==decode(f['positive']['data']) and decode(p['entries'])=={}
                      assert n.get('error') and not n['model'] and not n['entries']
                      left,right=decode(f['positive']['data']),decode(f['negative']['data'])
                      lm,rm=(left[f['parent']][0],right[f['parent']][0]) if f['parent'] else (left,right)
                      if f['rule']=='missing':
                          assert f['field'] in lm and f['field'] not in rm
                      elif f['rule']=='nonstring':
                          assert isinstance(lm[f['field']],str) and rm[f['field']]==42
                      else:
                          assert f['rule']=='empty-set' and lm[f['field']] and rm[f['field']]==[]
                      lm.pop(f['field'],None);rm.pop(f['field'],None)
                      assert left==right
              typedcases=[c for c in raw['cases'] if '/native-typed-production-' in c['case']]
              assert len(typedcases)==(2 if name=='did-1.1' else 0)
              from datetime import datetime, timezone
              import re
              def typedvalue(v,normalized):
                  kind=v['kind']
                  if kind=='string': return v['text']
                  if kind=='integer': return ('integer',str(int(v['text'])))
                  if kind=='double': return ('double','2.0' if v['text']=='2' else v['text'])
                  if kind=='boolean': return v.get('flag',False)
                  if kind=='null': return None
                  if kind=='datetime':
                      return datetime.fromisoformat(re.sub(r'\.\d+', '', v['text'])).astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ') if normalized else v['text']
                  if kind=='list': return [typedvalue(x,normalized) for x in v.get('items',[])]
                  assert kind=='map'
                  return {m['name']:typedvalue(m['value'],normalized) for m in v.get('members',[])}
              for case in typedcases:
                  obs=case['observations'][0]
                  assert len(case['observations'])==1 and obs['verdict']=='PASS' and obs['input'] and obs['observed']
                  q,r=json.loads(obs['input']),json.loads(obs['observed'])
                  assert not r.get('build_error') and not r.get('capture_error') and len(r['calls'])==1
                  assert r['id']==q['id'] and r['controller_shape']=='set' and r['controllers']==q['controllers'] and len(r['controllers'])==2
                  assert r['fields']==q['fields'] and r['entries']==q['entries']
                  p=r['calls'][0]
                  assert p['operation']=='github.com/sage-x-project/did-go/producer.Producer.Produce'
                  assert p['version']=='1.1' and p['json_ld']==q['json_ld'] and not p['include_secret'] and p['media_type']=='application/did'
                  assert not p.get('error') and not p.get('capture_error')
                  decode=lambda value: json.loads(base64.b64decode(value,validate=True).decode('utf-8'),parse_int=lambda x:('integer',x),parse_float=lambda x:('double',x))
                  pre={'id':q['id'],'controller':q['controllers'],**{m['name']:typedvalue(m['value'],False) for m in q['fields']}}
                  representation={m['name']:typedvalue(m['value'],False) for m in q['entries']}
                  assert decode(p['model'])==pre and decode(p['entries'])==representation
                  wire={'id':q['id'],'controller':q['controllers'],**{m['name']:typedvalue(m['value'],True) for m in q['fields']},**{m['name']:typedvalue(m['value'],True) for m in q['entries']}}
                  if q['json_ld']: wire['@context']='https://www.w3.org/ns/did/v1.1'
                  assert decode(p['output'])==wire
              consumed=[c for c in raw['cases'] if '/native-typed-consumption-' in c['case']]
              assert len(consumed)==(2 if name=='did-1.1' else 0)
              def jsonkind(v):
                  if isinstance(v,tuple): return (v[0],str(int(v[1])) if v[0]=='integer' else str(float(v[1])).removesuffix('.0'))
                  if v is None: return ('null',)
                  if isinstance(v,bool): return ('boolean',v)
                  if isinstance(v,str): return ('string',v)
                  if isinstance(v,list): return ('list',[jsonkind(x) for x in v])
                  assert isinstance(v,dict)
                  return ('map',{k:jsonkind(x) for k,x in v.items()})
              def witnesskind(v):
                  k=v['kind']
                  if k in ['string','integer','double']: return (k,v['text'])
                  if k=='boolean': return (k,v.get('flag',False))
                  if k=='null': return (k,)
                  if k=='list': return (k,[witnesskind(x) for x in v.get('items',[])])
                  assert k=='map'
                  members=v.get('members',[])
                  assert len({m['name'] for m in members})==len(members)
                  return (k,{m['name']:witnesskind(m['value']) for m in members})
              def instant(text):
                  match=re.fullmatch(r'(.*?)(?:\.(\d{1,9}))?(Z|[+-]\d{2}:\d{2})',text)
                  assert match
                  date=datetime.fromisoformat(match[1]+('+00:00' if match[3]=='Z' else match[3]))
                  return (int(date.timestamp()),int((match[2] or '').ljust(9,'0')))
              for case in consumed:
                  assert len(case['observations'])==1
                  obs=case['observations'][0]
                  assert obs['statement']=='did11-cr20260305#consumption.1' and obs['verdict']=='PASS'
                  q,out=json.loads(obs['input']),json.loads(obs['observed']);call=out['call']
                  assert q['media_type']==call['media_type']=='application/did' and q['data']==call['input']
                  assert call['operation']=='github.com/sage-x-project/did-go/consumer.Consumer.Consume'
                  assert call['require']==call['expected']=='unknown' and not call['strict']
                  assert call['version']=='1.1' and not call['json_ld'] and not call.get('dropped_terms')
                  assert not call.get('error') and not call.get('capture_error') and not out.get('capture_error')
                  literal=base64.b64decode(q['data'],validate=True).decode('utf-8')
                  typed=json.loads(literal,parse_int=lambda x:('integer',x),parse_float=lambda x:('double',x))
                  source=json.loads(literal)
                  assert out['id']==source['id'] and out['controllers']==source['controller'] and out['controller_shape']=='set'
                  assert len(source['controller'])==2 and len(source['verificationMethod'])==1
                  fields={m['name']:witnesskind(m['value']) for m in out['fields']}
                  assert len(fields)==len(out['fields'])
                  assert fields=={k:jsonkind(x) for k,x in typed.items() if k not in ['id','controller','verificationMethod']}
                  assert not out['entries'] and len(out['methods'])==1
                  actual=out['methods'][0];method=source['verificationMethod'][0]
                  assert actual['id']==method['id']
                  for key in ['expires','revoked']:
                      assert actual[key]['kind']=='datetime' and instant(actual[key]['text'])==instant(method[key])
                  model=json.loads(base64.b64decode(call['model'],validate=True))
                  for key in ['expires','revoked']:
                      assert instant(model['verificationMethod'][0][key])==instant(source['verificationMethod'][0][key])
                      model['verificationMethod'][0][key]=source['verificationMethod'][0][key]
                  assert model==source and json.loads(base64.b64decode(call['entries'],validate=True))=={}
              inputcases=[c for c in raw['cases'] if '/native-representation-input-' in c['case']]
              assert len(inputcases)==(4 if name=='did-1.1' else 0)
              assert sum('/native-representation-input-producer-' in c['case'] for c in inputcases)==(2 if name=='did-1.1' else 0)
              for case in inputcases:
                  assert len(case['observations'])==1
                  obs=case['observations'][0];assert obs['verdict']=='PASS'
                  q,out=json.loads(obs['input']),json.loads(obs['observed'])
                  if '/native-representation-input-producer-' in case['case']:
                      assert obs['statement']=='did11-cr20260305#production-and-consumption.8'
                      assert not out.get('build_error') and not out.get('capture_error') and len(out['calls'])==1
                      call=out['calls'][0]
                      assert call['operation']=='github.com/sage-x-project/did-go/producer.Producer.Produce'
                      assert call['version']=='1.1' and call['json_ld']==q['json_ld'] and not call['include_secret'] and not call.get('capture_error')
                      assert out['id']==q['id'] and out['controllers']==q['controllers'] and out['controller_shape']=='set'
                      assert out['fields']==q['fields'] and out['entries']==q['entries']
                      pre={'id':q['id'],'controller':q['controllers'],**{m['name']:typedvalue(m['value'],False) for m in q['fields']}}
                      entries={m['name']:typedvalue(m['value'],False) for m in q['entries']}
                      decode=lambda value: json.loads(base64.b64decode(value,validate=True),parse_int=lambda x:('integer',x),parse_float=lambda x:('double',x))
                      assert decode(call['model'])==pre and decode(call['entries'])==entries
                  else:
                      assert '/native-representation-input-consumer-' in case['case']
                      assert obs['statement']=='did11-cr20260305#production-and-consumption.13'
                      call=out['call']
                      assert q['data']==call['input'] and q['media_type']==call['media_type']=='application/did'
                      assert call['operation']=='github.com/sage-x-project/did-go/consumer.Consumer.Consume'
                      assert call['require']==call['expected']=='unknown' and not call['strict']
                      assert isinstance(json.loads(base64.b64decode(call['input'],validate=True)),dict)
              contextcases=[c for c in raw['cases'] if '/native-producer-context-' in c['case']]
              assert len(contextcases)==(3 if name=='did-1.1' else 0)
              kinds=set()
              for case in contextcases:
                  assert len(case['observations'])==1
                  obs=case['observations'][0]
                  assert obs['statement']=='did11-cr20260305#production-and-consumption.12' and obs['verdict']=='PASS'
                  fixture,pair=json.loads(obs['input']),json.loads(obs['observed'])
                  good,bad=fixture['positive'],fixture['negative']
                  assert good['json_ld'] and bad['json_ld'] and good['id']==bad['id'] and good['controllers']==bad['controllers']
                  assert good['fields']==bad['fields']==None and len(good['entries'])==len(bad['entries'])==1
                  assert good['entries'][0]=={'name':'@context','value':{'kind':'string','text':'https://www.w3.org/ns/did/v1.1'}}
                  value=bad['entries'][0]['value'];kinds.add(value['kind'])
                  assert bad['entries'][0]['name']=='@context'
                  invalid={'boolean':False,'integer':42,'list':['https://www.w3.org/ns/did/v1.1',False]}[value['kind']]
                  def contextvalue(v):
                      if v['kind']=='string': return v['text']
                      if v['kind']=='boolean': return v.get('flag',False)
                      if v['kind']=='integer': return int(v['text'])
                      assert v['kind']=='list'
                      return [contextvalue(x) for x in v['items']]
                  assert contextvalue(value)==invalid
                  for key,q in [('positive',good),('negative',bad)]:
                      out=pair[key]
                      assert not out.get('build_error') and not out.get('capture_error') and len(out['calls'])==1
                      assert out['id']==q['id'] and out['controllers']==q['controllers'] and out['controller_shape']=='set'
                      assert not out['fields'] and out['entries']==q['entries']
                      call=out['calls'][0]
                      assert call['operation']=='github.com/sage-x-project/did-go/producer.Producer.Produce'
                      assert call['version']=='1.1' and call['json_ld'] and not call['include_secret'] and not call.get('capture_error')
                      decode=lambda value: json.loads(base64.b64decode(value,validate=True))
                      model={'id':q['id'],'controller':q['controllers']}
                      assert decode(call['model'])==model and decode(call['entries'])=={'@context':contextvalue(q['entries'][0]['value'])}
                      if key=='negative' and call.get('error'):
                          assert not call['output']
                      else:
                          assert not call.get('error') and call['media_type']=='application/did'
                          wire=decode(call['output']);ctx=wire['@context']
                          assert ctx=='https://www.w3.org/ns/did/v1.1' or ctx==['https://www.w3.org/ns/did/v1.1']
                          wire.pop('@context');assert wire==model
              assert kinds==({'boolean','integer','list'} if name=='did-1.1' else set())
          PYTHON
      - name: Verify all anchored reviews and grouped operation evidence
        env:
          SAGE_BATCH_REPORT_DIR: ${{ runner.temp }}/sage-reports
        run: |
          python3 ../../scripts/check_sage_remaining.py --raw "$RUNNER_TEMP/sage-reports/resolution-did-1.1-raw.json" --report "$RUNNER_TEMP/sage-reports/resolution-did-1.1.json"
          python3 -m unittest discover -s ../../scripts -p 'test_check_sage_*.py' -v
      - name: Check complete SAGE pending clause inventory
        run: |
          python3 - <<'PYTHON'
          import collections, hashlib, json, os
          from pathlib import Path
          repo=Path('../..')
          inventory=json.loads((repo/'docs/sage-resolution-gaps.json').read_text())
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'sage-reports/resolution-did-1.1.json').read_text())
          raw=json.loads((Path(os.environ['RUNNER_TEMP'])/'sage-reports/resolution-did-1.1-raw.json').read_text())
          assert inventory['schema']=='sage-resolution-gap-inventory/2'
          assert inventory['scope']=='resolution' and inventory['profile']==report['profile']=='did-1.1'
          assert inventory['baseline']['subject']==report['subject']==raw['subject']
          assert inventory['baseline']['publications']==report['specs']
          assert report['inspector']['revision']==os.environ['GITHUB_SHA']
          assert inventory['expected_live_totals']==report['totals']
          assert inventory['expected_live_totals_by_level']==report['totals_by_level']
          assert inventory['expected_live_cases']==len(raw['cases'])==361
          pending=inventory['pending']
          observed=inventory['observed_since_baseline']
          ids=[row['id'] for row in pending]
          assert len(ids)==len(set(ids))==110
          assert set(ids)=={row['id'] for row in report['statements'] if row['verdict']=='NOT_RUN'}
          allrows=pending+observed
          allids=[row['id'] for row in allrows]
          assert len(allids)==len(set(allids))==inventory['baseline']['totals']['NOT_RUN']==416
          assert hashlib.sha256(json.dumps(sorted(allids),separators=(',',':')).encode()).hexdigest()==inventory['baseline']['pending_ids_sha256']
          assert len(observed)==306
          assert collections.Counter(row['expected_live_verdict'] for row in observed)=={'PASS':293,'NOT_APPLICABLE':3,'FAIL':10}
          live={row['id']:row['verdict'] for row in report['statements']}
          cases={case['case']:case for case in raw['cases']}
          assert len(cases)==len(raw['cases'])
          for row in observed:
              assert row['case_prefix'] in ['/native-result-','/native-metadata-','/native-branch-','/wire-branch-','/native-key-fields-','/native-representation-','/native-pipeline-','/native-production-root-','/native-consumer-','/native-consumer-conformance-','/native-typed-production-','/native-typed-consumption-','/native-representation-input-','/native-producer-context-','/library-syntax-','/library-codec-','/library-client-','/library-retrieval-','/library-document-','/library-context-','/native-contract-','/key-policy-','/key-policy-format-','/optional-','/remaining-','/choice-','/representation-options-','/resource-choice-','/integer-source-','/fragment-source-','/fragment-initial-','/fragment-search-','/fragment-relationship-','/service-source-','/selection-source-','/dispatch-source-']
              assert live[row['id']]==row['expected_live_verdict']
              prefixes=row.get('case_prefixes',[row['case_prefix']])
              assert prefixes and len(prefixes)==len(set(prefixes)) and row['case_prefix'] in prefixes
              if 'case_prefixes' in row: assert row['id'] in ['cid10#conformance.2','did11-cr20260305#production-and-consumption.18'] and prefixes==['/native-consumer-conformance-','/key-policy-format-']
              expectedcases={case['case'] for case in raw['cases'] if any(prefix in case['case'] for prefix in prefixes) and any(o['statement']==row['id'] for o in case['observations'])}
              assert row['cases'] and len(row['cases'])==len(set(row['cases']))
              assert set(row['cases'])==expectedcases
              matches=[]
              for caseid in row['cases']:
                  found=[o for o in cases[caseid]['observations'] if o['statement']==row['id']]
                  assert len(found)==1
                  observation=found[0]
                  assert observation['verdict'] in ['PASS','NOT_APPLICABLE','FAIL']
                  assert observation['input'] and observation['observed'] and observation['detail']
                  matches.append(observation['verdict'])
              assert row['expected_live_verdict'] in matches
          statements={}
          for publication in ['did11-cr20260305','cid10','res10-crd20261001']:
              for row in json.loads((repo/'statements'/(publication+'.json')).read_text())['statements']:
                  statements[row['id']]=row
          scope=json.loads((repo/'statements/scope.json').read_text())
          categories=collections.Counter()
          for row in allrows:
              original=statements[row['id']]
              assert row['baseline_verdict']=='NOT_RUN'
              assert row['level']==original['level'] and row['keywords']==original.get('keywords',[])
              assert row['text_sha256']==hashlib.sha256(original['text'].encode()).hexdigest()
              assert row['generic_scope']==scope[row['id']]['scope']
              route=inventory['routes'][row['route']]
              assert route['operation'] and route['prerequisite'] and route['evidence']
              for reference in route['evidence']:
                  assert (repo/reference).is_file()
              if row['id'] in set(ids):
                  categories[route['category']]+=1
          assert dict(categories)==inventory['categories']
          assert collections.Counter(row['level'] for row in allrows)=={'requirement':368,'recommendation':48}
          assert collections.Counter(row['level'] for row in pending)=={'requirement':80,'recommendation':30}
          print('Verified 110 pending and 306 newly observed clauses; all 416 historical ids retained')
          PYTHON
